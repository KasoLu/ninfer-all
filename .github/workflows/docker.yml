# Publishes ghcr.io/<owner>/<repo> after CI passes on master: the runtime image around the
# binaries that CI built and tested (its dist-sm86 and dist-sm120a artifacts), so nothing is
# compiled twice and nothing unpublished by CI reaches the image. Tags:
#   latest            the newest master commit that passed CI
#   <VERSION>         the newest such commit of that release line
#   sha-<12 hex>      every published commit
name: Container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: container-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Runs finish out of order. Only the commit that is still master's head may move `latest`
      # and the version tag; an older one is published under its sha tag alone.
      - name: Tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${SHA:0:12}"
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [[ "$head" == "$SHA" ]]; then
            tags+=",$image:latest,$image:$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          ls -R dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-contexts: dist=dist
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.description=NInfer: Qwen3.5/3.6/3.8 inference server for RTX 30, 40 and 50 GPUs
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
