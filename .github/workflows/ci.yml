# Continuous integration, all of it without a GPU: GitHub-hosted runners have none, so the CUDA
# builds compile every target and run the test suite with each GPU test skipping itself (exit 77).
# A green run of this workflow on master is what publishes the container image (docker.yml).
#
#   * docs/config-calculator.test.mjs -- pins the published calculator's arithmetic against the
#     engine's own figures.
#
#   * scripts/check-linux-scripts.sh -- the guard over the shell scripts shipped in the Linux
#     release archive. Running it *here* rather than only on the Windows box is the point: two
#     launchers once shipped with CRLF that made them unparseable on Linux, and every tool on the
#     Windows box called the tree clean because Git Bash strips CR on read. Only real Linux bash
#     saw it.
#
#   * tests/host/test_host_kv_clamp.cpp -- pins the pinned-host-KV-cache clamp arithmetic
#     (src/core/host_kv_clamp.h) used by the Windows startup path in program_impl.h.
#
#   * the Python suites under tests/ (artifact framing and conversion), on CPU PyTorch.
#
#   * tests/test_docker_build_cache.sh -- the Dockerfile's incremental build cache.
#
#   * the CUDA build of every target for sm_86 and sm_120a in the Dockerfile's toolchain stage,
#     then CTest. ccache carries over between runs; the binaries go to the image.
name: CI

on:
  pull_request:
  push:
    # ci/** runs the whole workflow on a branch without a pull request; only master publishes.
    branches: [master, 'ci/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculator:
    name: Config calculator arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No dependencies and no build step: the test loads the page's own <script> into a vm
      # sandbox, which is what keeps docs/config-calculator.html a single file.
      - name: Run docs/config-calculator.test.mjs
        run: node docs/config-calculator.test.mjs
      # The arithmetic tests never call render(), which is where most of the page's code is.
      - name: Run docs/config-calculator.render.test.mjs
        run: node docs/config-calculator.render.test.mjs

  host-kv-clamp:
    name: Host KV clamp arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run tests/host/test_host_kv_clamp.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Isrc tests/host/test_host_kv_clamp.cpp \
              -o test_host_kv_clamp
          ./test_host_kv_clamp

  linux-scripts:
    name: Linux launcher and downloader guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The checkout must not normalize line endings, or the CRLF check tests nothing. Git's
      # default is to write out whatever .gitattributes says, which is exactly what a release
      # archive would carry, so this is the honest input.
      - name: Run scripts/check-linux-scripts.sh
        run: bash scripts/check-linux-scripts.sh
      # bash -n on every shell script in the tree, under real Linux bash rather than Git Bash.
      # This is the check that would have caught the CRLF breakage directly.
      - name: Parse every shell script
        run: |
          status=0
          while IFS= read -r script; do
            if ! bash -n "$script"; then
              echo "::error file=$script::does not parse under bash -n"
              status=1
            fi
          done < <(git ls-files '*.sh')
          exit $status

  python:
    name: Python suites (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and the test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy safetensors pytest jinja2 gguf tokenizers transformers
      - name: Run tests/artifact and tests/convert
        run: python -m pytest -q tests/artifact tests/convert

  docker-build-cache:
    name: Dockerfile build cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run tests/test_docker_build_cache.sh
        run: bash tests/test_docker_build_cache.sh docker

  cuda:
    name: CUDA build and tests (sm_${{ matrix.arch }}, no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: ['86', '120a']
    env:
      CCACHE_HOST_DIR: ${{ github.workspace }}/../ccache
    steps:
      # The runner image's preinstalled SDKs take most of its disk; a CUDA build tree and its
      # ccache need it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the toolchain stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          load: true
          tags: ninfer-toolchain:ci
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-sm${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-sm${{ matrix.arch }}-
      # A step timeout below the job's, so that a cold build which runs out of time still saves
      # its ccache and the next run continues from there.
      - name: Build every target
        timeout-minutes: 320
        run: |
          mkdir -p "$CCACHE_HOST_DIR"
          docker run --rm -v "$PWD:/src" -v "$CCACHE_HOST_DIR:/ccache" -w /src \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=4G -e NINFER_CUDA_ARCH=${{ matrix.arch }} \
            -e NINFER_BUILD_DIR=/src/build-ci ninfer-toolchain:ci bash -c \
            'ccache --zero-stats && scripts/build-native.sh configure && scripts/build-native.sh build && ccache --show-stats'
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-sm${{ matrix.arch }}-${{ github.sha }}
      - name: Run CTest
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e NINFER_BUILD_DIR=/src/build-ci \
            ninfer-toolchain:ci scripts/build-native.sh test
      - name: Stage the image binaries
        run: |
          docker run --rm -v "$PWD:/src" -w /src ninfer-toolchain:ci \
            docker/stage-dist.sh build-ci ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sm${{ matrix.arch }}
          path: dist/
          retention-days: 7
